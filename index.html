<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,viewport-fit=cover">
<title>Marvel Champions Offline</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b1b1b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Champions">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#2b2b2b;color:#c6c6c6;font-family:system-ui,Arial,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;visibility:hidden}
  #app.visible{visibility:visible}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
          background:radial-gradient(#333,#111);text-align:center;padding:24px;box-sizing:border-box;transition:opacity .4s}
  #splash.hidden{opacity:0;pointer-events:none}
  #splash h1{margin:0;font-size:clamp(22px,5vw,38px);letter-spacing:.04em;color:#fff}
  #splash.error h1{color:#ff6b6b}
  progress{width:min(360px,80vw);height:8px;accent-color:#e23636}
  #msg{max-width:min(640px,90vw);min-height:1.4em;font-size:15px}
  #msg pre{white-space:pre-wrap;text-align:left;background:#0006;padding:12px;border-radius:8px;font-size:13px}
  button{font:inherit;padding:10px 22px;border-radius:8px;border:0;background:#e23636;color:#fff;cursor:pointer}
  /* portrait phone, in a game: lay the (landscape) board across the screen */
  #app.rotated{inset:auto;top:0;left:0;width:100vh;height:100vw;width:100dvh;height:100dvw;transform-origin:0 0;transform:translateY(100vh) rotate(-90deg);transform:translateY(100dvh) rotate(-90deg)}
  #rotate{display:none}
</style>
</head>
<body>
<div id="splash"><h1 id="title">Marvel Champions<br><small style="font-weight:400;font-size:.5em">Digital Edition · sin conexión</small></h1>
  <progress id="bar" max="100" value="0"></progress><div id="msg">Preparando la app…</div></div>
<iframe id="app" allow="fullscreen; clipboard-write; web-share"></iframe>
<div id="rotate">📱↻ Gira el teléfono en horizontal para ver todo el tablero (toca para ocultar)</div>
<script type="module" src="shell.js"></script>
</body>
</html>
